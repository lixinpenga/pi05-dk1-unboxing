[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pi05-dk1-unboxing"
version = "0.1.0"
description = "π₀.₅ × TRLC-DK1 双臂执行器拆箱"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["numpy>=2,<3", "Pillow>=11,<14", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
lerobot = ["lerobot[dataset] @ git+https://github.com/huggingface/lerobot.git@e5be0c16be1df4ae004abb4167842a7456c4cd54"]
train = ["lerobot[dataset,training,pi,peft] @ git+https://github.com/huggingface/lerobot.git@e5be0c16be1df4ae004abb4167842a7456c4cd54"]
robot = [
    "pi05-dk1-unboxing[lerobot]",
    "lerobot_robot_trlc_dk1 @ git+https://github.com/robot-learning-co/trlc-dk1.git@12f5368aefd0381461f2c7ffbb5611b4e8c90de9",
]

[project.scripts]
dk1-unboxing = "dk1_unboxing.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dk1_unboxing"]

[tool.ruff]
line-length = 105
target-version = "py312"
